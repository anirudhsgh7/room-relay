name: RoomRelay CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roomrelay
          POSTGRES_PASSWORD: roomrelay_test
          POSTGRES_DB: roomrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomrelay -d roomrelay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ROOMRELAY_SESSION_SECRET: ci-only-session-secret-roomrelay-0123456789abcdef
      ROOMRELAY_CAMPUS_TIMEZONE: Europe/London
      DATABASE_URL: postgresql://roomrelay:roomrelay_test@127.0.0.1:5432/roomrelay_test
      DATABASE_URL_UNPOOLED: postgresql://roomrelay:roomrelay_test@127.0.0.1:5432/roomrelay_test
      TEST_DATABASE_URL: postgresql://roomrelay:roomrelay_test@127.0.0.1:5432/roomrelay_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize database and demo fixtures
        run: npm run db:setup

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production smoke test
        run: npm run test:smoke
